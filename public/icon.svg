<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="128" cy="128" r="128" fill="url(#grad)"/>
  
  <!-- Inner circle -->
  <circle cx="128" cy="128" r="115" fill="#0a1628"/>
  
  <!-- Terminal icon -->
  <rect x="40" y="80" width="176" height="120" rx="8" fill="none" stroke="#00ff88" stroke-width="3"/>
  
  <!-- Terminal lines -->
  <line x1="50" y1="95" x2="100" y2="95" stroke="#00ff88" stroke-width="2"/>
  <line x1="50" y1="110" x2="180" y2="110" stroke="#00ff88" stroke-width="2"/>
  <line x1="50" y1="125" x2="160" y2="125" stroke="#00ff88" stroke-width="2"/>
  <line x1="50" y1="140" x2="190" y2="140" stroke="#00ff88" stroke-width="2"/>
  <line x1="50" y1="155" x2="140" y2="155" stroke="#00ff88" stroke-width="2"/>
  <line x1="50" y1="170" x2="170" y2="170" stroke="#00ff88" stroke-width="2"/>
  
  <!-- AI brain icon (small at top right) -->
  <circle cx="200" cy="70" r="15" fill="#00ff88"/>
  <circle cx="195" cy="65" r="3" fill="#0a1628"/>
  <circle cx="205" cy="65" r="3" fill="#0a1628"/>
  <circle cx="195" cy="75" r="3" fill="#0a1628"/>
  <circle cx="205" cy="75" r="3" fill="#0a1628"/>
  
  <!-- Text overlay -->
  <text x="128" y="230" font-size="20" font-weight="bold" fill="#00ff88" text-anchor="middle">AI Builder</text>
</svg>
